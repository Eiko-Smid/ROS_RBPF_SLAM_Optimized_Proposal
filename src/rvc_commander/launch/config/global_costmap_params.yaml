global_costmap:
  update_frequency: 1
  publish_frequency: 1
  transform_tolerance: 1
  width: 40                   # The maximum width of the global map. If the map is bigger it will be cut off.
  height: 40                  # The maximum height of the global map. If the map is bigger it will be cut off.
  origin_x: 0
  origin_y: 0
  static_map: true            # That means, the existing map will not be updated, when new obstacles occur  
  rolling_window: true
  resolution: 0.1             # Grid resolution   